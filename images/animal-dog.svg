<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="dog mascot">
  <defs>
    <linearGradient id="dog-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C99A6B"/>
      <stop offset="100%" stop-color="#A07A4E"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="108" rx="34" ry="6" fill="rgba(10,37,64,0.10)"/>
  <!-- tail -->
  <path d="M84 88 C100 84 102 70 94 64 C90 80 86 84 82 88 Z" fill="url(#dog-fur)"/>
  <!-- body -->
  <ellipse cx="58" cy="84" rx="30" ry="22" fill="url(#dog-fur)"/>
  <!-- belly -->
  <ellipse cx="58" cy="92" rx="18" ry="12" fill="#F2E1C7"/>
  <!-- legs -->
  <rect x="38" y="92" width="10" height="18" rx="4" fill="url(#dog-fur)"/>
  <rect x="68" y="92" width="10" height="18" rx="4" fill="url(#dog-fur)"/>
  <!-- head -->
  <ellipse cx="58" cy="48" rx="28" ry="26" fill="url(#dog-fur)"/>
  <!-- ears (floppy) -->
  <path d="M30 36 C20 36 18 56 26 64 L38 56 Z" fill="#8E6840"/>
  <path d="M86 36 C96 36 98 56 90 64 L78 56 Z" fill="#8E6840"/>
  <!-- snout -->
  <ellipse cx="58" cy="58" rx="14" ry="11" fill="#F2E1C7"/>
  <!-- nose -->
  <ellipse cx="58" cy="50" rx="4" ry="3" fill="#0A2540"/>
  <!-- mouth -->
  <path d="M58 54 V58 M58 58 C54 62 50 62 48 58 M58 58 C62 62 66 62 68 58" stroke="#0A2540" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="46" cy="42" r="3" fill="#0A2540"/>
  <circle cx="70" cy="42" r="3" fill="#0A2540"/>
  <circle cx="47" cy="41" r="1" fill="#FFFFFF"/>
  <circle cx="71" cy="41" r="1" fill="#FFFFFF"/>
  <!-- eyebrows -->
  <path d="M40 34 L48 32 M80 34 L72 32" stroke="#5C3F22" stroke-width="2" stroke-linecap="round"/>
  <!-- tongue -->
  <ellipse cx="58" cy="62" rx="3" ry="4" fill="#FF6B35"/>
</svg>
