  </g>
  <text x="600" y="780" font-family="Inter, system-ui" font-size="64" font-weight="800" fill="#FFFFFF" text-anchor="middle" opacity="0.4" letter-spacing="-0.04em">HERO</text>
  <text x="600" y="840" font-family="Inter, system-ui" font-size="20" font-weight="500" fill="#FFFFFF" text-anchor="middle" opacity="0.5" letter-spacing="0.2em">PLACEHOLDER 1200×1500</text>
</svg>
