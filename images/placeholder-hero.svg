<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-label="Hero placeholder">
  <defs>
    <linearGradient id="ph-hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="50%" stop-color="#163A5F"/>
      <stop offset="100%" stop-color="#1E4A7A"/>
    </linearGradient>
    <linearGradient id="ph-hero-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#ph-hero-bg)"/>
  <circle cx="900" cy="300" r="320" fill="url(#ph-hero-glow)"/>
  <g opacity="0.1" fill="none" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 750 H1200"/>
    <path d="M0 800 H1200"/>
    <path d="M0 700 H1200"/>
    <circle cx="600" cy="750" r="200"/>
    <circle cx="600" cy="750" r="320"/>
